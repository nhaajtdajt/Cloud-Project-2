<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Đăng nhập vào ứng dụng Quản lý Công việc - Task Manager Serverless trên AWS">
    <title>Đăng nhập — Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ============================================================
         TRANG ĐĂNG NHẬP
         ============================================================ -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-icon">📋</span>
                <h1>Task Manager</h1>
                <p>Đăng nhập để quản lý công việc của bạn</p>
            </div>

            <!-- Thông báo lỗi -->
            <div class="auth-error" id="auth-error"></div>

            <!-- Form đăng nhập -->
            <form class="auth-form" id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-email">Email</label>
                    <input type="email" class="form-input" id="login-email"
                           placeholder="example@email.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Mật khẩu</label>
                    <input type="password" class="form-input" id="login-password"
                           placeholder="Nhập mật khẩu" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary" id="btn-login">
                    🔓 Đăng nhập
                </button>
            </form>

            <div class="auth-footer">
                Chưa có tài khoản?
                <a href="signup.html">Đăng ký ngay</a>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script>
        // Nếu đã đăng nhập → redirect về trang chính
        redirectIfAuthenticated();

        // Xử lý form đăng nhập
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('auth-error');

            // Ẩn lỗi cũ
            errorEl.classList.remove('show');

            showLoading();
            try {
                const result = await signIn(email, password);
                saveAuthData(result);
                showToast('Đăng nhập thành công!');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            } catch (error) {
                console.error('Login error:', error);
                let message = 'Đăng nhập thất bại. Vui lòng thử lại.';
                if (error.code === 'UserNotFoundException' || error.code === 'NotAuthorizedException') {
                    message = 'Email hoặc mật khẩu không đúng.';
                } else if (error.code === 'UserNotConfirmedException') {
                    message = 'Tài khoản chưa được xác nhận. Vui lòng kiểm tra email.';
                } else if (error.message) {
                    message = error.message;
                }
                errorEl.textContent = message;
                errorEl.classList.add('show');
            } finally {
                hideLoading();
            }
        });
    </script>
</body>
</html>
