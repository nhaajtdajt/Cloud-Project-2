<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ứng dụng Quản lý Công việc Serverless trên AWS - Task Manager với CRUD, lọc theo ưu tiên và ngày hạn">
    <title>Task Manager — Quản lý Công việc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ============================================================
         NAVBAR
         ============================================================ -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <span class="brand-icon">📋</span>
                <span>Task Manager</span>
            </a>
            <div class="navbar-user">
                <span class="user-email" id="user-email">loading...</span>
                <button class="btn btn-logout" id="btn-logout">
                    🚪 Đăng xuất
                </button>
            </div>
        </div>
    </nav>

    <!-- ============================================================
         MAIN CONTENT
         ============================================================ -->
    <main class="container" style="padding-top: 32px; padding-bottom: 60px;">

        <!-- ============================================================
             THỐNG KÊ
             ============================================================ -->
        <div class="stats-bar" id="stats">
            <!-- Được render bởi app.js -->
        </div>

        <!-- ============================================================
             FORM TẠO / SỬA CÔNG VIỆC
             ============================================================ -->
        <div class="card">
            <h2 class="card-title" id="form-title">➕ Tạo công việc mới</h2>
            <form id="task-form">
                <div class="form-group">
                    <label class="form-label" for="input-title">Tiêu đề *</label>
                    <input type="text" class="form-input" id="input-title"
                           placeholder="Nhập tiêu đề công việc" required maxlength="200">
                </div>

                <div class="form-group">
                    <label class="form-label" for="input-description">Mô tả (tùy chọn)</label>
                    <textarea class="form-textarea" id="input-description"
                              placeholder="Chi tiết công việc..." maxlength="1000"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="input-priority">Mức ưu tiên</label>
                        <select class="form-select" id="input-priority">
                            <option value="medium">🟡 Trung bình</option>
                            <option value="low">🟢 Thấp</option>
                            <option value="high">🔴 Cao</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="input-dueDate">Ngày hạn</label>
                        <input type="date" class="form-input" id="input-dueDate">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="input-status">Trạng thái</label>
                        <select class="form-select" id="input-status">
                            <option value="pending">⏳ Đang chờ</option>
                            <option value="done">✅ Hoàn thành</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 8px;">
                    <button type="submit" class="btn btn-primary" id="btn-submit">
                        ➕ Tạo công việc
                    </button>
                    <button type="button" class="btn btn-secondary hidden" id="btn-cancel-edit">
                        ✖️ Hủy sửa
                    </button>
                </div>
            </form>
        </div>

        <!-- ============================================================
             BỘ LỌC
             ============================================================ -->
        <div class="card">
            <h2 class="card-title">🔍 Bộ lọc</h2>
            <div class="filters-bar">
                <div class="form-group">
                    <label class="form-label" for="filter-priority">Mức ưu tiên</label>
                    <select class="form-select" id="filter-priority">
                        <option value="">Tất cả</option>
                        <option value="high">🔴 Cao</option>
                        <option value="medium">🟡 Trung bình</option>
                        <option value="low">🟢 Thấp</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="filter-date-from">Từ ngày</label>
                    <input type="date" class="form-input" id="filter-date-from">
                </div>

                <div class="form-group">
                    <label class="form-label" for="filter-date-to">Đến ngày</label>
                    <input type="date" class="form-input" id="filter-date-to">
                </div>

                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button class="btn btn-secondary" id="btn-clear-filters">
                        🔄 Xóa bộ lọc
                    </button>
                </div>
            </div>
            <div class="filter-count" id="filter-count"></div>
        </div>

        <!-- ============================================================
             DANH SÁCH CÔNG VIỆC
             ============================================================ -->
        <h2 class="section-title">📝 Danh sách công việc</h2>
        <div class="tasks-grid" id="tasks-list">
            <!-- Được render bởi app.js -->
            <div class="empty-state">
                <div class="empty-icon">⏳</div>
                <h3>Đang tải...</h3>
            </div>
        </div>

    </main>

    <!-- ============================================================
         LOADING OVERLAY
         ============================================================ -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
