<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ứng dụng Quản lý Công việc Serverless trên AWS - Task Manager với CRUD, lọc theo ưu tiên và ngày hạn">
    <title>TaskFlow CRM — Quản lý Công việc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- ============================================================
             SIDEBAR LAYOUT (CRM STYLE)
             ============================================================ -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <path d="M9 17h6"></path>
                        <path d="M9 12h6"></path>
                        <path d="M9 7h6"></path>
                    </svg>
                </div>
                <h1 class="brand-name">TaskFlow</h1>
            </div>

            <div class="sidebar-user">
                <div class="user-avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="user-info">
                    <span class="user-email" id="user-email">loading...</span>
                    <span class="user-role">Đội ngũ kỹ thuật</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item active">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Không gian làm việc</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn" id="btn-theme-toggle" style="margin-bottom: 8px; width: 100%; justify-content: flex-start; background: transparent; border-color: var(--border-color); color: var(--text-secondary);">
                    <svg class="btn-icon theme-sun-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="btn-icon theme-moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <span id="theme-text">Chế độ sáng</span>
                </button>
                <button class="btn btn-logout" id="btn-logout">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Đăng xuất</span>
                </button>
            </div>
        </aside>

        <!-- ============================================================
             MAIN CONTENT
             ============================================================ -->
        <main class="main-content">
            <!-- Header -->
            <header class="content-header">
                <div class="header-title">
                    <h2>Danh sách Công việc</h2>
                    <p class="header-subtitle">Quản lý, phân công và kiểm tra tiến độ dự án</p>
                </div>
            </header>

            <!-- Thống kê KPIs -->
            <section class="stats-grid" id="stats">
                <!-- Được render bởi app.js -->
            </section>

            <!-- Dashboard Workspace -->
            <div class="workspace-grid">
                <!-- Main Workspace Column (Left) -->
                <div class="workspace-main">
                    <!-- Bộ lọc -->
                    <div class="card filters-card">
                        <div class="card-header">
                            <div class="header-icon-title">
                                <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                                </svg>
                                <h3>Bộ lọc tìm kiếm</h3>
                            </div>
                        </div>
                        <div class="filters-bar">
                            <div class="form-group">
                                <label class="form-label" for="filter-priority">Mức ưu tiên</label>
                                <select class="form-select" id="filter-priority">
                                    <option value="">Tất cả</option>
                                    <option value="high">Cao</option>
                                    <option value="medium">Trung bình</option>
                                    <option value="low">Thấp</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="filter-date">Ngày đến hạn</label>
                                <input type="date" class="form-input" id="filter-date">
                            </div>

                            <div class="form-group actions-group">
                                <button class="btn btn-secondary" id="btn-clear-filters">
                                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M23 4v6h-6"></path>
                                        <path d="M1 20v-6h6"></path>
                                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                                    </svg>
                                    <span>Làm mới</span>
                                </button>
                            </div>
                        </div>
                        <div class="filter-count" id="filter-count"></div>
                    </div>

                    <!-- Danh sách task -->
                    <div class="tasks-section-header">
                        <h3>Danh mục việc cần làm</h3>
                    </div>
                    <div class="tasks-grid" id="tasks-list">
                        <!-- Được render bởi app.js -->
                        <div class="empty-state">
                            <div class="loading-spinner"></div>
                        </div>
                    </div>
                </div>

                <!-- Side Workspace Column (Right) -->
                <div class="workspace-side">
                    <div class="card form-card">
                        <div class="card-header">
                            <h3 class="card-title-main" id="form-title">Tạo công việc mới</h3>
                        </div>
                        <form id="task-form">
                            <div class="form-group">
                                <label class="form-label" for="input-title">Tiêu đề *</label>
                                <input type="text" class="form-input" id="input-title"
                                       placeholder="Tên công việc..." required maxlength="200">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="input-description">Mô tả công việc</label>
                                <textarea class="form-textarea" id="input-description"
                                          placeholder="Mô tả chi tiết..." maxlength="1000"></textarea>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="input-priority">Mức ưu tiên</label>
                                <select class="form-select" id="input-priority">
                                    <option value="medium">Trung bình</option>
                                    <option value="low">Thấp</option>
                                    <option value="high">Cao</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="input-dueDate">Hạn hoàn thành</label>
                                <input type="date" class="form-input" id="input-dueDate">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="input-status">Trạng thái</label>
                                <select class="form-select" id="input-status">
                                    <option value="pending">Đang chờ</option>
                                    <option value="done">Hoàn thành</option>
                                </select>
                            </div>

                            <div class="form-actions-row">
                                <button type="submit" class="btn btn-primary" id="btn-submit">
                                    Tạo công việc
                                </button>
                                <button type="button" class="btn btn-secondary hidden" id="btn-cancel-edit">
                                    Hủy sửa
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- AWS Cognito & Custom Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
